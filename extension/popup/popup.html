<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Bulk Studio</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>AI Bulk Studio</h1>
      <p class="sub">Grok Imagine · Google Flow/Veo</p>
    </header>

    <div class="status" id="status">
      <div class="row"><span>Active project</span><b id="proj">—</b></div>
      <div class="row"><span>Platform</span><b id="plat">—</b></div>
      <div class="row"><span>Pending</span><b id="pending">0</b></div>
      <div class="row"><span>Completed</span><b id="completed">0</b></div>
      <div class="row"><span>Downloaded</span><b id="downloaded">0</b></div>
    </div>

    <button class="primary big" id="openPanel" data-testid="open-side-panel-btn">Open Side Panel</button>
    <button class="ghost" id="openGrok" data-testid="open-grok-btn">Open Grok Imagine</button>
    <button class="ghost" id="openFlow" data-testid="open-flow-btn">Open Google Flow / Veo</button>

    <footer>
      <small>v1.0.0 · Mobile-friendly</small>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
